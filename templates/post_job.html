<!DOCTYPE html>
<html>
<head>
    <title>Post Job</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<h2>Post a Job</h2>

<form action="/post_job" method="POST">

    <input type="text" name="job_title" placeholder="Job Title" required><br><br>

    <input type="text" name="company_name" placeholder="Company Name" required><br><br>

    <input type="text" name="location" placeholder="Location" required><br><br>

    <input type="text" name="salary" placeholder="Salary"><br><br>

    <textarea name="description" placeholder="Job Description"></textarea><br><br>

    <button type="submit">Post Job</button>

</form>

</body>
</html>
